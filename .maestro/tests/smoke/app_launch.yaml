# 대상 앱이 정상적으로 설치되어 실행되는지 확인하는 최소 스모크 테스트.
appId: ${APP_ID}
name: 앱 실행 스모크 테스트
tags:
  - smoke
---
- runFlow:
    file: ../../subflows/launch_app_fresh.yaml
    env:
      CLEAR_STATE: "true"

# 이 앱은 Unity 로 만들어졌기 때문에 화면에 그려지는 문구가 접근성 트리에 노출되지 않는다.
# 뷰 계층에서 조회할 수 있는 요소는 렌더링 표면인 unitySurfaceView 하나뿐이므로,
# 앱이 소유한 이 요소가 전면에 올라온 것을 확인하는 방식으로 실행 여부를 검증한다.
# 시스템 UI 나 런처의 요소로는 통과하지 않으므로, 기기가 잠겨 있으면 이 단계에서 실패한다.
- extendedWaitUntil:
    visible:
      id: ${APP_ID}:id/unitySurfaceView
    timeout: 30000

- takeScreenshot: launch_first_screen
